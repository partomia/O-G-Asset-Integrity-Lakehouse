# ---------------------------------------------------------------------------
# ML guardrails (guardrails/, docs/GUARDRAILS.md). Every check that fires is an event
# in ref.guardrail_event (and outputs/guardrails/events.jsonl in the CAI project).
# ---------------------------------------------------------------------------
input:
  # frame quality: a keyframe that fails any of these gets band NA (reviewed in calendar order).
  # Tuned on the 105 clean + 105 degraded library frames and 300 training images: 1 % of clean
  # frames rejected; glare and low light 100 % caught, blur 72 % (docs/GUARDRAILS.md)
  min_side_px: 64
  brightness: {min: 0.25, max: 0.92}      # mean HSV value
  min_contrast: 0.03                      # std of grey level
  min_sharpness: 0.012                    # mean absolute grey-level gradient
  max_glare_fraction: 0.50                # share of near-white pixels (V > 0.97, S < 0.10)
  # out-of-distribution: standardised distance of the feature vector to the training set
  # (mean of squared z-scores); the limit is the training set's ood_quantile, stored with the model
  ood_quantile: 0.995
  # sensor sanity (stream_telemetry_agg.py, build_gold.py): the asset abstains, it is not guessed
  stuck_windows_abstain: 1
  # an asset the asset master did not resolve is never scored
  require_resolved_asset: true

output:
  # a severe probability within this distance of the operating threshold is not ranked:
  # "uncertain, engineer review"
  uncertain_margin: 0.05
  # a criticality-A asset never drops below P2 on a model score alone
  safety_floor: {criticality: ["A"], min_band: "P2"}
  # the model ranks and suggests; only an engineer opens or closes a work order
  allowed_actions: ["rank", "suggest_inspection"]

process:
  kpi_gate: gate/kpi_gate.py              # chain stops, champion keeps serving
  feature_hash_lock: true                 # endpoint refuses to start on a mismatch
  named_approver_for_promotion: true      # serve/promote_champion.py
  drift:                                  # monitor/drift.py (ogx-05-nightly-drift)
    psi_warn: 0.10
    psi_alert: 0.25
    min_samples: 30
    max_ood_rate: 0.10
    max_na_rate: 0.25

retrain:                                  # ci/retrain_trigger.py (ogx-08-retrain-trigger)
  on_drift_alert: true
  drift_cooldown_days: 7                  # drift alone retrains at most weekly (same data -> same model)
  min_new_labels: 20                      # engineer-confirmed frame labels since the last training
  max_model_age_days: 30
